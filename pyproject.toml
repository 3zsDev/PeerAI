[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peerai"
version = "0.1.0"
description = "Look at something on screen; a local model explains it in a side panel."
requires-python = ">=3.11,<3.13"
dependencies = [
    "mss>=9",
    "pillow>=10",
    "ollama>=0.4",
    "openai>=1.50",
    "pynput>=1.7",
    "uiautomation>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
webcam = ["mediapipe>=0.10", "opencv-python>=4.9", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
peerai = "peerai.main:main"

[tool.setuptools.packages.find]
include = ["peerai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
